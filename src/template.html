<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>io.stream: cgroup-Granular FDP for Unmodified Workloads | HotStorage '26</title>
  <style>
    /* Self-hosted so the deck renders identically with no network. */
    @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('vendor/fonts/Inter-400.woff2') format('woff2');}
    @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('vendor/fonts/Inter-500.woff2') format('woff2');}
    @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('vendor/fonts/Inter-600.woff2') format('woff2');}
    @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url('vendor/fonts/Inter-700.woff2') format('woff2');}
    @font-face{font-family:'Inter';font-style:normal;font-weight:800;font-display:swap;src:url('vendor/fonts/Inter-800.woff2') format('woff2');}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('vendor/fonts/JetBrainsMono-400.woff2') format('woff2');}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:swap;src:url('vendor/fonts/JetBrainsMono-600.woff2') format('woff2');}

    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0b0f19 100%);
      --card-bg: rgba(17, 24, 39, 0.8);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-purple: #c084fc;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard',
        'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
      --font-code: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .header-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .deck-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .slide {
      position: absolute;
      width: 100%;
      max-width: 1240px;
      height: 100%;
      max-height: 740px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.98);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      overflow-y: auto;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .slide-header {
      margin-bottom: 1.5rem;
    }

    .slide-header h2 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .slide-subtitle {
      font-size: 1.1rem;
      color: var(--accent-blue);
      font-weight: 500;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      font-size: 1rem;
      line-height: 1.6;
      /* Lets tall children (diagrams) shrink instead of growing the slide. */
      min-height: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      min-height: 0;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
      min-height: 0;
    }

    /* A grid used as the slide body must not outgrow the slide: cap the row
       at the available height so diagram-heavy columns scale down. */
    .slide-body.grid-2,
    .slide-body.grid-3 {
      grid-template-rows: minmax(0, 1fr);
    }

    .grid-2 > *,
    .grid-3 > * {
      min-height: 0;
      min-width: 0;
    }

    .card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card h3 {
      font-size: 1.25rem;
      color: var(--accent-indigo);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
    }

    .card p,
    .card ul {
      color: var(--text-main);
      font-size: 1rem;
    }

    ul {
      list-style-type: none;
    }

    ul li {
      position: relative;
      padding-left: 1.3rem;
      margin-bottom: 0.8rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    ul li strong {
      color: var(--text-main);
    }

    ul li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent-blue);
      font-size: 1.3rem;
      line-height: 1.2;
    }

    .highlight-box {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.1) 0%, rgba(129, 140, 248, 0.1) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 1.5rem;
    }

    .highlight-title {
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 0.4rem;
      font-size: 1.15rem;
    }

    .paper-fig {
      background: #ffffff;
      padding: 0.8rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .paper-fig img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 6px;
    }

    .fig-caption {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: #334155;
      font-weight: 600;
      line-height: 1.3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
      margin-top: 0.4rem;
    }

    th,
    td {
      padding: 0.8rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      color: var(--accent-blue);
      font-weight: 600;
    }

    tr.highlight-row {
      background: rgba(52, 211, 153, 0.12);
      font-weight: 600;
    }

    tr.highlight-row td {
      color: var(--accent-green);
    }

    code {
      font-family: var(--font-code);
      background: rgba(0, 0, 0, 0.45);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      color: var(--accent-purple);
      font-size: 0.88rem;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      width: 100%;
      box-sizing: border-box;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      z-index: 9999;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 1.2rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin: 0 2rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      width: 0%;
      transition: width 0.3s ease;
    }

    .slide-counter {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-family: var(--font-code);
    }

    /* Diagram Styles */
    .css-diagram {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
      justify-content: center;
      height: 100%;
    }
    .ssd-block-container {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      position: relative;
      width: 220px;
    }
    .ssd-block-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      color: #e2e8f0;
    }
    .page-row {
      height: 36px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      letter-spacing: 0.5px;
    }
    .page-invalid {
      background: repeating-linear-gradient(45deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.2) 10px, rgba(239, 68, 68, 0.1) 10px, rgba(239, 68, 68, 0.1) 20px);
      border: 1px dashed rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      text-decoration: line-through;
    }
    .page-valid-cold {
      background: linear-gradient(to right, #0ea5e9, #0284c7);
      border: 1px solid #0369a1;
      color: #f0f9ff;
    }
    .page-valid-hot {
      background: linear-gradient(to right, #f59e0b, #d97706);
      border: 1px solid #b45309;
      color: #fffbeb;
    }
    .page-free {
      background: rgba(51, 65, 85, 0.4);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      color: #94a3b8;
    }
    .gc-flow-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      flex: 1;
    }
    .gc-arrow-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }
    .waf-equation {
      background: linear-gradient(90deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .waf-term {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .waf-value {
      font-size: 1.3rem;
      font-weight: 800;
      font-family: var(--font-code);
    }
    .waf-label {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .waf-operator {
      font-size: 1.5rem;
      color: #64748b;
      font-weight: bold;
    }

    .mermaid {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
      padding: 1.2rem;
      border: 1px solid var(--card-border);
      min-height: 0;
      overflow: hidden;
    }

    /* Keep generated diagrams inside the slide instead of pushing past it. */
    .mermaid svg {
      max-width: 100%;
      max-height: 100%;
      height: auto;
    }

    /* ---- Takeaway strip -------------------------------------------------
       Laid out as the slide's last flex child. It used to be absolutely
       positioned, which made it sit on top of .slide-body content. */
    .takeaway {
      margin: 0.2rem -2.5rem -2.5rem;
      padding: 0.85rem 2.5rem;
      text-align: center;
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.45;
      background: rgba(0, 0, 0, 0.45);
      border-top: 2px solid var(--accent-blue);
      color: var(--accent-blue);
      border-radius: 0 0 20px 20px;
      flex: none;
    }

    .takeaway[data-tone="amber"] { border-top-color: var(--accent-amber); color: var(--accent-amber); }
    .takeaway[data-tone="green"] { border-top-color: var(--accent-green); color: var(--accent-green); }
    .takeaway[data-tone="purple"] { border-top-color: var(--accent-purple); color: var(--accent-purple); }
    .takeaway[data-tone="red"] { border-top-color: var(--accent-red); color: var(--accent-red); }

    /* ---- WAF bar chart (replaces the paper screenshots) ---------------- */
    .wafchart {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 0.6rem;
      flex: 1;
      min-height: 0;
      padding: 1.2rem 1rem 0;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
    }

    .wafbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
      flex: 1;
      height: 100%;
      min-width: 0;
    }

    .wafnum {
      font-family: var(--font-code);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      flex: none;
    }

    .wafcol {
      width: 100%;
      max-width: 74px;
      min-height: 5px;
      border-radius: 5px 5px 0 0;
      background: rgba(148, 163, 184, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.7);
      border-bottom: none;
      flex: none;
    }

    .wafcol[data-tone="good"] { background: rgba(52, 211, 153, 0.55); border-color: var(--accent-green); }
    .wafcol[data-tone="ok"] { background: rgba(56, 189, 248, 0.45); border-color: var(--accent-blue); }
    .wafcol[data-tone="bad"] { background: rgba(248, 113, 113, 0.5); border-color: var(--accent-red); }

    .waflabel {
      font-size: 0.82rem;
      line-height: 1.35;
      text-align: center;
      color: #cbd5e1;
      border-top: 2px solid rgba(148, 163, 184, 0.5);
      padding-top: 0.4rem;
      width: 100%;
      flex: none;
    }

    .waflabel b { color: var(--text-main); display: block; }
    .waflabel em { font-style: normal; color: #94a3b8; font-size: 0.75rem; }

    .axis-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: var(--font-code);
      text-align: right;
      flex: none;
    }

    /* ---- Compact data table used for Table 1 --------------------------- */
    .datatable { font-size: 0.95rem; }
    .datatable th, .datatable td { padding: 0.42rem 0.7rem; }
    .datatable td.n {
      font-family: var(--font-code);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .datatable tr.group-start td { border-top: 1px solid rgba(255, 255, 255, 0.18); }
    .datatable td.path { color: var(--accent-blue); font-family: var(--font-code); font-size: 0.88rem; }

    /* ---- Speaker notes (toggle with N) --------------------------------- */
    .notes {
      display: none;
      margin: 0.2rem -2.5rem -2.5rem;
      padding: 0.8rem 2.5rem;
      background: rgba(56, 189, 248, 0.1);
      border-top: 1px dashed var(--accent-blue);
      color: #cbd5e1;
      font-size: 0.92rem;
      line-height: 1.55;
      border-radius: 0 0 20px 20px;
      flex: none;
    }

    .notes::before {
      content: "발표 노트 — ";
      color: var(--accent-blue);
      font-weight: 700;
    }

    body.show-notes .notes { display: block; }
    body.show-notes .takeaway { border-radius: 0; margin-bottom: 0; }

    .appendix-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-family: var(--font-code);
      letter-spacing: 0.08em;
      color: var(--accent-amber);
      border: 1px solid rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.12);
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      vertical-align: middle;
      margin-left: 0.6rem;
    }

    @media print {
      body { overflow: visible; height: auto; background: #0b0f19; }
      header, footer { display: none; }
      .deck-container { height: auto; display: block; padding: 0; }
      .slide {
        position: static;
        opacity: 1;
        visibility: visible;
        transform: none;
        max-height: none;
        height: 185mm;
        page-break-after: always;
        margin: 0 auto 6mm;
        box-shadow: none;
      }
      .notes { display: block; }
    }
  </style>
</head>

<body>

  <header>
    <div class="badge">HotStorage '26</div>
    <div class="header-title">io.stream: cgroup-Granular FDP for Unmodified Workloads</div>
    <div></div>
  </header>

  <div class="deck-container">

        <!-- SLIDES_GO_HERE -->
</div>

  <footer>
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">← 이전 (Left)</button>
    <div style="display: flex; align-items: center; justify-content: center; flex: 1; gap: 1.5rem;">
      <div class="progress-bar-container" style="width: 400px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; margin: 0;">
        <div class="progress-bar-fill" id="progressBar" style="height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); width: 0%; transition: width 0.3s ease;"></div>
      </div>
      <div class="slide-counter" id="slideCounter" style="font-family: var(--font-code); color: #94a3b8; font-size: 0.95rem; min-width: 60px; text-align: right;">1 / 21</div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">다음 (Right) →</button>
  </footer>

  <script>
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounter = document.getElementById('slideCounter');
    const progressBar = document.getElementById('progressBar');

    let currentSlide = 0;

    function updateDeck() {
      slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentSlide);
      });

      slideCounter.innerText = `${currentSlide + 1} / ${slides.length}`;
      progressBar.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === slides.length - 1;
    }

    function changeSlide(direction) {
      currentSlide = Math.max(0, Math.min(slides.length - 1, currentSlide + direction));
      updateDeck();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Space') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft') {
        changeSlide(-1);
      } else if (e.key === 'n' || e.key === 'N') {
        document.body.classList.toggle('show-notes');
      }
    });

    updateDeck();
  </script>

  <!-- Vendored and version-pinned: the deck must render with no network. -->
  <script src="vendor/mermaid-10.9.3.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });

  </script>

</body>

</html>
