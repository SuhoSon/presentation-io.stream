<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>io.stream: cgroup-Granular FDP for Unmodified Workloads | HotStorage '26</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0b0f19 100%);
      --card-bg: rgba(17, 24, 39, 0.8);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-purple: #c084fc;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      --font-code: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .header-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .deck-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .slide {
      position: absolute;
      width: 100%;
      max-width: 1240px;
      height: 100%;
      max-height: 740px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px) scale(0.98);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      overflow-y: auto;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .slide-header {
      margin-bottom: 1.5rem;
    }

    .slide-header h2 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .slide-subtitle {
      font-size: 1.1rem;
      color: var(--accent-blue);
      font-weight: 500;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      font-size: 1rem;
      line-height: 1.6;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
    }

    .card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card h3 {
      font-size: 1.25rem;
      color: var(--accent-indigo);
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
    }

    .card p,
    .card ul {
      color: var(--text-main);
      font-size: 1rem;
    }

    ul {
      list-style-type: none;
    }

    ul li {
      position: relative;
      padding-left: 1.3rem;
      margin-bottom: 0.8rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    ul li strong {
      color: var(--text-main);
    }

    ul li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent-blue);
      font-size: 1.3rem;
      line-height: 1.2;
    }

    .highlight-box {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.1) 0%, rgba(129, 140, 248, 0.1) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 1.5rem;
    }

    .highlight-title {
      color: var(--accent-blue);
      font-weight: 700;
      margin-bottom: 0.4rem;
      font-size: 1.15rem;
    }

    .paper-fig {
      background: #ffffff;
      padding: 0.8rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .paper-fig img {
      max-width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 6px;
    }

    .fig-caption {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: #334155;
      font-weight: 600;
      line-height: 1.3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1rem;
      margin-top: 0.4rem;
    }

    th,
    td {
      padding: 0.8rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      color: var(--accent-blue);
      font-weight: 600;
    }

    tr.highlight-row {
      background: rgba(52, 211, 153, 0.12);
      font-weight: 600;
    }

    tr.highlight-row td {
      color: var(--accent-green);
    }

    code {
      font-family: var(--font-code);
      background: rgba(0, 0, 0, 0.45);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      color: var(--accent-purple);
      font-size: 0.88rem;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      width: 100%;
      box-sizing: border-box;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      z-index: 9999;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.5rem 1.2rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin: 0 2rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      width: 0%;
      transition: width 0.3s ease;
    }

    .slide-counter {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-family: var(--font-code);
    }

    /* Diagram Styles */
    .css-diagram {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
      justify-content: center;
      height: 100%;
    }
    .ssd-block-container {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      position: relative;
      width: 220px;
    }
    .ssd-block-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      color: #e2e8f0;
    }
    .page-row {
      height: 36px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      letter-spacing: 0.5px;
    }
    .page-invalid {
      background: repeating-linear-gradient(45deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.2) 10px, rgba(239, 68, 68, 0.1) 10px, rgba(239, 68, 68, 0.1) 20px);
      border: 1px dashed rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      text-decoration: line-through;
    }
    .page-valid-cold {
      background: linear-gradient(to right, #0ea5e9, #0284c7);
      border: 1px solid #0369a1;
      color: #f0f9ff;
    }
    .page-valid-hot {
      background: linear-gradient(to right, #f59e0b, #d97706);
      border: 1px solid #b45309;
      color: #fffbeb;
    }
    .page-free {
      background: rgba(51, 65, 85, 0.4);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      color: #94a3b8;
    }
    .gc-flow-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      flex: 1;
    }
    .gc-arrow-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }
    .waf-equation {
      background: linear-gradient(90deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .waf-term {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .waf-value {
      font-size: 1.3rem;
      font-weight: 800;
      font-family: var(--font-code);
    }
    .waf-label {
      font-size: 0.85rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .waf-operator {
      font-size: 1.5rem;
      color: #64748b;
      font-weight: bold;
    }

    .mermaid {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--card-border);
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 350px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid var(--card-border);
    }
  </style>
</head>

<body>

  <header>
    <div class="badge">HotStorage '26</div>
    <div class="header-title">io.stream: cgroup 기반의 운영자 주도형 데이터 배치 구조</div>
    <div></div>
  </header>

  <div class="deck-container">

        <!-- SLIDES_GO_HERE -->
</div>

  <footer>
    <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">← 이전 (Left)</button>
    <div style="display: flex; align-items: center; justify-content: center; flex: 1; gap: 1.5rem;">
      <div class="progress-bar-container" style="width: 400px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; margin: 0;">
        <div class="progress-bar-fill" id="progressBar" style="height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); width: 0%; transition: width 0.3s ease;"></div>
      </div>
      <div class="slide-counter" id="slideCounter" style="font-family: var(--font-code); color: #94a3b8; font-size: 0.95rem; min-width: 60px; text-align: right;">1 / 15</div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">다음 (Right) →</button>
  </footer>

  <script>
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slideCounter = document.getElementById('slideCounter');
    const progressBar = document.getElementById('progressBar');

    let currentSlide = 0;

    function updateDeck() {
      slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentSlide);
      });

      slideCounter.innerText = `${currentSlide + 1} / ${slides.length}`;
      progressBar.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === slides.length - 1;
    }

    function changeSlide(direction) {
      currentSlide = Math.max(0, Math.min(slides.length - 1, currentSlide + direction));
      updateDeck();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft') {
        changeSlide(-1);
      }
    });

    updateDeck();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });

    // Initialize charts after a slight delay to ensure canvas is ready
    setTimeout(() => {
      // Bar Chart for Slide 13
      const ctxBar = document.getElementById('barChart');
      if (ctxBar) {
        new Chart(ctxBar, {
          type: 'bar',
          data: {
            labels: ['Coherent (io.stream)', 'Fallback', 'Blind', 'FDP-default', 'Oblivious'],
            datasets: [{
              label: 'Avg. WAF',
              data: [1.00, 1.07, 1.30, 1.62, 2.36],
              backgroundColor: [
                'rgba(52, 211, 153, 0.8)', // Green for Coherent
                'rgba(56, 189, 248, 0.6)',
                'rgba(129, 140, 248, 0.6)',
                'rgba(156, 163, 175, 0.6)',
                'rgba(248, 113, 113, 0.8)'  // Red for Oblivious
              ],
              borderColor: [
                'rgba(52, 211, 153, 1)',
                'rgba(56, 189, 248, 1)',
                'rgba(129, 140, 248, 1)',
                'rgba(156, 163, 175, 1)',
                'rgba(248, 113, 113, 1)'
              ],
              borderWidth: 1
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 2.5, grid: { color: 'rgba(255,255,255,0.1)' } }, x: { grid: { display: false } } },
            plugins: { legend: { display: false }, title: { display: true, text: '배치 정책별 쓰기 증폭(WAF) 상관 분석', color: '#fff' } },
            color: '#fff'
          }
        });
      }

      // Line Chart for Slide 14
      const ctxLine = document.getElementById('lineChart');
      if (ctxLine) {
        new Chart(ctxLine, {
          type: 'line',
          data: {
            labels: [0, 100, 200, 300, 400, 500, 600, 700],
            datasets: [
              { label: 'Baseline (No-FDP)', data: [1.0, 1.3, 1.5, 1.65, 1.7, 1.72, 1.71, 1.7], borderColor: '#9ca3af', borderDash: [5, 5], tension: 0.3 },
              { label: '비효율적 분리 (Mixed)', data: [1.0, 1.4, 1.6, 1.75, 1.8, 1.8, 1.78, 1.8], borderColor: '#f87171', markerType: 'triangle', tension: 0.3 },
              { label: '최적 분리 (io.stream)', data: [1.0, 1.1, 1.15, 1.2, 1.25, 1.27, 1.27, 1.27], borderColor: '#34d399', borderWidth: 3, tension: 0.3 }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { beginAtZero: false, min: 1.0, max: 2.0, title: { display: true, text: '누적 쓰기 증폭 계수 (Cumulative WAF)', color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }, x: { title: { display: true, text: '경과 시간 (단위: 분)', color: '#fff' }, grid: { display: false } } },
            plugins: { legend: { labels: { color: '#fff' } } },
            color: '#fff'
          }
        });
      }
    }, 500);
  </script>

</body>

</html>
